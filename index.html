  .jde-libelle{display:none!important;}
  .jde-hud>div:last-child{margin-left:auto;}
  .jde-cmd{height:28px!important;width:28px!important;border-width:2px!important;box-shadow:2px 2px 0 ${B}!important;}
  .jde-avc-wrap{padding-top:4px!important;}
  .jde-avc{padding:1px 6px 3px!important;border-width:2px!important;}
  .jde-avc-titre{font-size:12px!important;}
  .jde-barre{padding-top:4px!important;padding-bottom:6px!important;}
  .jde-pause{padding:8px 12px!important;max-width:30rem!important;}
  .jde-pause .text-3xl{font-size:20px!important;line-height:1.1!important;}
  .jde-pause .jde-btn{padding-top:3px!important;padding-bottom:3px!important;font-size:15px!important;}
  .jde-pause .mt-3{margin-top:6px!important;}
  .jde-pause .gap-2.5{gap:6px!important;}
  .jde-pause label{padding-top:0!important;padding-bottom:0!important;}
  .jde-pause-info{display:none!important;}
  .jde-barre .jde-btn{min-height:38px!important;padding-top:1px!important;padding-bottom:1px!important;}

@keyframes jdeQMoins{0%{background:#EF4444;}50%{background:#F472B6;}}
@keyframes jdeQPlus{0%{background:#4ADE80;}50%{background:#F472B6;}}
.jde-qmoins{animation:jdeQMoins .4s step-end .15s 4;}
.jde-qplus{animation:jdeQPlus .4s step-end .15s 4;}
.jde-curseur{accent-color:#F97316;height:22px;cursor:pointer;}
.jde-btn{transition:transform .06s steps(1),box-shadow .06s steps(1);}
.jde-btn:not(:disabled):active{transform:translate(3px,3px);box-shadow:1px 1px 0 ${B}!important;}
.jde-btn:focus-visible{outline:3px solid #FACC15;outline-offset:2px;}
.jde-card:hover .jde-hop,.jde-card:focus-visible .jde-hop,.jde-card[data-on="1"] .jde-hop{animation:jdeHop .5s steps(2,jump-none) infinite;}
@keyframes jdeHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes jdeFloat{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-40px);opacity:0}}
@keyframes jdeToast{0%{transform:translateY(-8px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes jdePop{0%{transform:scale(.6)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes jdeBlink{0%,100%{opacity:1}50%{opacity:.35}}
.jde-float{animation:jdeFloat .8s steps(8) forwards;}
.jde-barre>*{pointer-events:auto;}
@keyframes jdeMaison{0%{opacity:0}18%{opacity:1}82%{opacity:1}100%{opacity:0}}
.jde-maison{animation:jdeMaison 1.9s steps(12) forwards;}
.jde-toast{animation:jdeToast .18s steps(3) both;}
.jde-pop{animation:jdePop .3s steps(4) both;}
.jde-blink{animation:jdeBlink 1s steps(2) infinite;}
@media (prefers-reduced-motion: reduce){.jde-float,.jde-toast,.jde-pop,.jde-blink,.jde-card .jde-hop{animation:none!important}}
